name: erp-prod

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME:-app_production}
      MARIADB_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_DATABASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?RAILS_MASTER_KEY is required}
      # No Redis service is provisioned by this Compose stack; point this at
      # an externally managed Redis instance (required for Action Cable).
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required (see docker-compose.prod.yml)}
      SFTPGO_URL: http://sftpgo:8080
      SFTPGO_APP_USER: ${SFTPGO_APP_USER:-erp_app}
      SFTPGO_APP_PASSWORD: ${SFTPGO_APP_PASSWORD:?SFTPGO_APP_PASSWORD is required}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
      sftpgo:
        condition: service_started

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:3000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # One-off provisioning job: `docker compose -f docker-compose.prod.yml run --rm sftpgo_provision`.
  # See docker-compose.yml for why this is a separate short-lived
  # container instead of adding admin credentials to the backend service.
  sftpgo_provision:
    profiles: ["tools"]
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      SFTPGO_URL: http://sftpgo:8080
      SFTPGO_ADMIN_USER: ${SFTPGO_ADMIN_USER:?SFTPGO_ADMIN_USER is required}
      SFTPGO_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:?SFTPGO_ADMIN_PASSWORD is required}
      SFTPGO_APP_USER: ${SFTPGO_APP_USER:-erp_app}
      SFTPGO_APP_PASSWORD: ${SFTPGO_APP_PASSWORD:?SFTPGO_APP_PASSWORD is required}
    command: [ "bin/rails", "sftpgo:provision" ]
    depends_on:
      - sftpgo

  sftpgo:
    image: drakkan/sftpgo:v2
    restart: unless-stopped
    environment:
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${SFTPGO_ADMIN_USER:?SFTPGO_ADMIN_USER is required}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:?SFTPGO_ADMIN_PASSWORD is required}
      # See docker-compose.yml for why this second flag is required.
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SFTPGO_WEBADMIN_PORT:-8080}:8080"
      - "${BIND_ADDRESS:-127.0.0.1}:${SFTPGO_SFTP_PORT:-2022}:2022"
    volumes:
      - sftpgo_data:/srv/sftpgo/data
      - sftpgo_config:/srv/sftpgo/config
      - sftpgo_backups:/srv/sftpgo/backups

volumes:
  db_data:
  sftpgo_data:
  sftpgo_config:
  sftpgo_backups:
