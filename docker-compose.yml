name: erp

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env (run: make setup)}"
      MARIADB_DATABASE: "${DB_NAME:-app_development}"
      MARIADB_USER: "${DB_USERNAME:-app}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env (run: make setup)}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: "${DB_USERNAME:-app}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env (run: make setup)}"
      FRONTEND_ORIGIN: "http://localhost:${FRONTEND_PORT:-3000}"
      INTERNAL_API_SECRET: "${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in .env (run: make setup)}"
      RAILS_MASTER_KEY: "${RAILS_MASTER_KEY:-}"
      SFTPGO_URL: http://sftpgo:8080
      SFTPGO_APP_USER: "${SFTPGO_APP_USER:-erp_app}"
      SFTPGO_APP_PASSWORD: "${SFTPGO_APP_PASSWORD:?Set SFTPGO_APP_PASSWORD in .env (run: make setup)}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-3001}:3000"
    volumes:
      - ./backend:/rails
      - backend_bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      sftpgo:
        condition: service_started

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:3000
      INTERNAL_API_SECRET: "${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in .env (run: make setup)}"
      # Lets next.config.ts allow-list the actual published dev-server
      # origin (see the comment there for why this is needed).
      FRONTEND_PORT: "${FRONTEND_PORT:-3000}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

  # One-off provisioning job: `docker compose run --rm sftpgo_provision`.
  # Not part of `docker compose up` (profiles: [tools]) and never runs
  # long-lived, so the SFTPGo admin credentials live only in this
  # short-lived container's environment, not in the always-running
  # backend service (which only needs the far more limited SFTPGO_APP_*
  # account it uploads through).
  sftpgo_provision:
    profiles: ["tools"]
    build:
      context: backend
      dockerfile: Dockerfile.dev
    environment:
      SFTPGO_URL: http://sftpgo:8080
      SFTPGO_ADMIN_USER: "${SFTPGO_ADMIN_USER:?Set SFTPGO_ADMIN_USER in .env (run: make setup)}"
      SFTPGO_ADMIN_PASSWORD: "${SFTPGO_ADMIN_PASSWORD:?Set SFTPGO_ADMIN_PASSWORD in .env (run: make setup)}"
      SFTPGO_APP_USER: "${SFTPGO_APP_USER:-erp_app}"
      SFTPGO_APP_PASSWORD: "${SFTPGO_APP_PASSWORD:?Set SFTPGO_APP_PASSWORD in .env (run: make setup)}"
    command: [ "bin/rails", "sftpgo:provision" ]
    volumes:
      - ./backend:/rails
      - backend_bundle:/usr/local/bundle
    depends_on:
      - sftpgo

  sftpgo:
    image: drakkan/sftpgo:v2
    restart: unless-stopped
    environment:
      SFTPGO_DEFAULT_ADMIN_USERNAME: "${SFTPGO_ADMIN_USER:?Set SFTPGO_ADMIN_USER in .env (run: make setup)}"
      SFTPGO_DEFAULT_ADMIN_PASSWORD: "${SFTPGO_ADMIN_PASSWORD:?Set SFTPGO_ADMIN_PASSWORD in .env (run: make setup)}"
      # SFTPGO_DEFAULT_ADMIN_USERNAME/PASSWORD alone are not sufficient;
      # SFTPGo only actually creates that admin on first boot if this flag
      # is also set (double underscore maps to the nested
      # data_provider.create_default_admin config key).
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SFTPGO_WEBADMIN_PORT:-8080}:8080"
      - "${BIND_ADDRESS:-127.0.0.1}:${SFTPGO_SFTP_PORT:-2022}:2022"
    volumes:
      - sftpgo_data:/srv/sftpgo/data
      - sftpgo_config:/srv/sftpgo/config
      - sftpgo_backups:/srv/sftpgo/backups

volumes:
  db_data:
  backend_bundle:
  frontend_node_modules:
  frontend_next:
  sftpgo_data:
  sftpgo_config:
  sftpgo_backups:
